name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Clone WebView Project Template
        run: |
          git clone https://github.com/mitchtabian/Android-Webview-Example.git app_template
          rm -rf app_template/app/src/main/assets/*
          cp index.html app_template/app/src/main/assets/ || true
          cp -r * app_template/app/src/main/assets/ || true

      - name: Build APK with Gradle
        run: |
          cd app_template
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app_template/app/build/outputs/apk/debug/*.apk
